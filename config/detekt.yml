# Detekt configuration — seed defaults (students may tune)
# Docs: https://detekt.dev/docs/rules/
# The Gradle task fails the build on any finding (ignoreFailures = false).

complexity:
  LongMethod:
    allowedLines: 30
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 10
  TooManyFunctions:
    allowedFunctionsPerFile: 15
    allowedFunctionsPerClass: 15

style:
  MagicNumber:
    active: false  # too noisy for a seed
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 140

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*|`.*`'  # allow backtick test names

potential-bugs:
  active: true
